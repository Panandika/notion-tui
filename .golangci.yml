version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - misspell
    - unconvert
    - gocritic
    - unparam
  settings:
    gocritic:
      disabled-checks:
        # Bubble Tea Update methods switch on the message type and usually
        # start with one case; rewriting them as "if" fights the idiom.
        - singleCaseSwitch
    gosec:
      excludes:
        - G304 # Cache file paths are built from the configured cache directory
  exclusions:
    paths:
      - testdata
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Panandika/notion-tui

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
